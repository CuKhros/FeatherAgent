name: Bug report
description: Report a reproducible functional defect or platform build issue
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste keys, private paths, full logs, or security-sensitive details into an issue. Security issues should follow the private process in SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x64
        - Windows x64
        - Other (unsupported platform)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: For example v1.2.0-rc.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Commands, sessions, plugins, WebUI requests; provide a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, usernames, private paths, and API keys before pasting.
      render: text
