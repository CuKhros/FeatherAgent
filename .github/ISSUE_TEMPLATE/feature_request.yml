name: Feature request
description: Propose a verifiable feature or documentation improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the use case and current limitation, not just "add a feature".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Note whether it changes the kernel contract, plugin manifest, or platform build.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / impact
      description: Does it affect Linux/Windows parity, size gates, or the permission model?
