name: 功能建议
description: 提出可验证的功能或文档改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景和当前限制，不要只写“加个功能”。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 尽量说明是否需要改内核契约、插件 manifest 或平台构建。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 影响面
      description: 是否影响 Linux/Windows 双平台、体积门禁或权限模型。
