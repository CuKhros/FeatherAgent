[package]
name = "featheragent"
version = "1.2.1-rc.4.4"
edition = "2021"
description = "FeatherAgent（轻羽）：把机械重复的步骤交给同机 1B~14B 小模型执行——上下文引擎 + 极轻量可移植 Agent 内核，供上层 Agent 调度"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CuKhros/FeatherAgent"
authors = ["FeatherAgent contributors"]
rust-version = "1.80"

[lib]
name = "featheragent"
path = "src/lib.rs"

[[bin]]
name = "featheragent"
path = "src/bin/kernel.rs"

[[bin]]
name = "featheragent-tui"
path = "src/bin/tui.rs"

[[bin]]
name = "featheragent-webui"
path = "src/bin/webui.rs"


[[bin]]
name = "featheragent-en"
path = "src/bin/kernel_en.rs"

[[bin]]
name = "featheragent-tui-en"
path = "src/bin/tui_en.rs"

[[bin]]
name = "featheragent-webui-en"
path = "src/bin/webui_en.rs"

[[bin]]
name = "feather-plugin-en"
path = "src/bin/plugin_en.rs"
test = false

[[bin]]
name = "feather-storage-en"
path = "src/bin/storage_en.rs"
test = false

[[bin]]
name = "feather-storage"
path = "src/bin/storage.rs"

[[bin]]
name = "feather-plugin"
path = "src/bin/plugin.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
crc32c = "0.6"
blake3 = "1"
parking_lot = "0.12"
zstd = "0.13"
wasmi = "0.31"
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.26"
crossterm = "0.27"
unicode-width = "0.1"
regex = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 交叉编译到 windows-gnu 时 blake3 的汇编静态库会被 rustc 当作损坏的 .drectve 丢弃，
# 链接期报 undefined reference；Windows 目标改用纯 Rust 实现。
blake3 = { version = "1", features = ["pure"] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
proptest = "1"
wat = "1"
tempfile = "3"

# 体积手法见设计文档 §2.3 / §10.1
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.release.package."*"]
opt-level = "z"
