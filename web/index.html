<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeatherAgent</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">FeatherAgent <span class="ver">v1.1.6</span></div>
    <div class="meta">
      <span id="session-label">未选择会话</span>
      <span class="dot" id="state-dot"></span><span id="state-label">idle</span>
    </div>
    <div class="meta" id="conn">正在连接内核…</div>
    <button id="btn-settings" class="settings-btn" title="服务端、模型与采样设置">⚙ 设置</button>
  </header>

  <main>
    <aside class="sessions">
      <div class="panel-title">会话</div>
      <div class="new-row">
        <input id="new-id" placeholder="新会话 id（可空）">
        <button id="btn-new">新建</button>
      </div>
      <div id="session-list" class="list"></div>
    </aside>

    <section class="chat">
      <div class="panel-title">对话</div>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="actions">
          <button id="btn-send" class="primary">发送</button>
          <button id="btn-cancel">取消</button>
          <button id="btn-fork">Fork</button>
          <span id="hint" class="hint"></span>
        </div>
      </div>
    </section>

    <aside class="context">
      <div class="panel-title">上下文</div>
      <div id="ctx" class="ctx">尚无快照</div>
    </aside>
  </main>

  <div id="settings-page" class="settings-page hidden">
    <div class="settings-card">
      <div class="settings-head">
        <div>
          <h2>设置</h2>
          <p class="warn">保存后通过 <code>config.set</code> 提交给内核，立即应用到下一次推理。</p>
        </div>
        <button id="btn-settings-close" class="ghost">关闭</button>
      </div>

      <div class="settings-section">
        <div class="section-title">服务端</div>
        <div class="settings-grid">
          <label>Provider 插件
            <select id="cfg-provider"></select>
          </label>
          <label>Base URL
            <input id="cfg-base-url" placeholder="http://127.0.0.1:11434" autocomplete="off">
          </label>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-title">模型与采样</div>
        <div class="settings-grid">
          <label>模型
            <div class="model-row">
              <input id="cfg-model" placeholder="qwen2.5:7b" autocomplete="off">
              <select id="cfg-model-select" title="已发现的模型"></select>
            </div>
            <span id="cfg-models-hint" class="form-hint"></span>
          </label>
          <label>温度 <span id="cfg-temperature-val" class="value">0.70</span>
            <input id="cfg-temperature" type="range" min="0" max="2" step="0.05" value="0.7">
          </label>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-title">上下文高级选项</div>
        <div class="settings-grid">
          <label>上下文窗口（tokens）
            <input id="cfg-context-window" type="number" min="512" max="131072" step="256" value="8192">
          </label>
          <label>单轮最大工具回合
            <input id="cfg-max-turns" type="number" min="1" max="32" step="1" value="6">
          </label>
        </div>
        <label class="check-row">
          <input id="cfg-auto-allow-safe" type="checkbox"> 自动放行安全工具（如读文件）
        </label>
      </div>

      <div class="settings-actions">
        <span id="settings-status" class="hint"></span>
        <button id="btn-settings-refresh">刷新模型列表</button>
        <button id="btn-settings-cancel" class="ghost">取消</button>
        <button id="btn-settings-save" class="primary">保存并应用</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>危险工具需要确认</h3>
      <p id="modal-tool"></p>
      <p class="warn">这是协作式权限门，不是沙箱：确认后工具将以当前用户权限执行。</p>
      <div class="actions">
        <button id="btn-allow" class="danger">允许</button>
        <button id="btn-deny">拒绝</button>
      </div>
    </div>
  </div>
</body>
</html>
