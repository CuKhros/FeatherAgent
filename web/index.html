<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FeatherAgent：把机械重复的步骤交给本机 1B–14B 小模型执行——上下文引擎与轻量 Agent 内核，供上层 Agent 调度">
  <title>FeatherAgent</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo-tile.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><img class="brand-logo" src="/logo.png" alt="FeatherAgent">FeatherAgent <span class="ver">v{{VERSION}}</span></div>
    <div class="meta">
      <span id="session-label">未选择会话</span>
      <span class="dot" id="state-dot"></span><span id="state-label">idle</span>
    </div>
    <div class="meta" id="conn">正在连接内核…</div>
    <button id="btn-settings" class="settings-btn" title="服务端、模型与采样设置">⚙ 设置</button>
    <button id="btn-plugins" class="ghost top-plugins" title="插件管理与插件页面">🧩 插件</button>
  </header>

  <main>
    <aside class="sessions">
      <div class="panel-title">会话</div>
      <div class="new-row">
        <input id="new-id" placeholder="新会话 id（可空）">
        <button id="btn-new">新建</button>
      </div>
      <div class="new-row">
        <select id="new-workspace" title="会话所属项目工作区"></select>
        <button id="btn-new-workspace" class="ghost" title="在 workspace_root 下新建项目">＋项目</button>
      </div>
      <div id="session-list" class="list"></div>
    </aside>

    <section class="chat">
      <div class="panel-title">对话</div>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <div id="attachments" class="attachments"></div>
        <div class="composer-main">
          <button id="btn-attach" class="attach" type="button" aria-label="Attach file">+</button>
          <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        </div>
        <input id="file-input" type="file" multiple hidden>
        <div class="actions">
          <button id="btn-send" class="primary">发送</button>
          <button id="btn-stop" class="danger">停止并保存</button>
          <button id="btn-compact">压缩上下文</button>
          <button id="btn-fork">Fork</button>
          <span id="hint" class="hint"></span>
        </div>
      </div>
    </section>

    <aside class="context">
      <div class="panel-title">上下文</div>
      <div id="ctx" class="ctx">尚无快照</div>
    </aside>
  </main>

  <div id="settings-page" class="settings-page hidden">
    <div class="settings-shell">
      <aside class="settings-nav">
        <div class="nav-title">设置</div>
        <button class="nav-item active" data-view="general">常规</button>
        <button class="nav-item" data-view="plugins">插件管理</button>
        <div class="nav-subtitle">插件页面</div>
        <div id="plugin-nav" class="plugin-nav"></div>
        <div class="nav-foot">侧栏与设置项都由插件清单声明：内核只转述，前端按声明渲染，装新插件不需要改 UI。</div>
      </aside>

      <div class="settings-card">
        <div class="settings-head">
          <div>
            <h2 id="settings-title">设置</h2>
            <p id="settings-subtitle" class="warn">保存后通过 <code>config.set</code> 提交给内核；插件自己的设置在左侧对应插件页里，由插件声明、内核转述。</p>
          </div>
          <button id="btn-settings-close" class="ghost">关闭</button>
        </div>

        <div id="view-general" class="settings-view">
          <div class="settings-section">
            <div class="section-title">服务端</div>
            <div class="settings-grid">
              <label>Provider 插件
                <select id="cfg-provider"></select>
              </label>
              <label>Base URL
                <input id="cfg-base-url" placeholder="http://127.0.0.1:11434" autocomplete="off">
              </label>
              <label>API Key（可选）
                <input id="cfg-provider-key" type="password" placeholder="留空则不发送 Authorization" autocomplete="off">
                <span class="form-hint">仅保存在本机 config.json，只发给当前 provider；Ollama / llama.cpp / NInfer 通常留空。</span>
              </label>
            </div>
          </div>

          <div class="settings-section">
            <div class="section-title">模型与采样</div>
            <div class="settings-grid">
              <label>模型
                <div class="model-row">
                  <input id="cfg-model" placeholder="qwen2.5:7b" autocomplete="off">
                  <select id="cfg-model-select" title="已发现的模型"></select>
                </div>
                <span id="cfg-models-hint" class="form-hint"></span>
              </label>
              <label>温度 <span id="cfg-temperature-val" class="value">0.70</span>
                <input id="cfg-temperature" type="range" min="0" max="2" step="0.05" value="0.7">
              </label>
            </div>
          </div>

          <div class="settings-section">
            <div class="section-title">上下文与工作区</div>
            <div class="settings-grid">
              <label>上下文窗口（tokens）
                <input id="cfg-context-window" type="number" min="512" max="131072" step="256" value="8192">
              </label>
              <label>单轮最大工具回合
                <input id="cfg-max-turns" type="number" min="1" max="32" step="1" value="6">
              </label>
            </div>
            <label class="stack-row">项目工作区容器（留空 = 安装根/workspace）
              <input id="cfg-workspace-root" placeholder="D:\Projects\featheragent-workspaces 或 /home/me/work" autocomplete="off">
              <span class="form-hint">这里不是单个工作区，而是项目容器：每个直接子目录是一个独立项目，各自拥有 <code>.featheagent/</code>（worklog.md / memory.md）。可指向安装目录外；保存后需重启 serve。</span>
            </label>
            <label class="check-row">
              <input id="cfg-auto-allow-safe" type="checkbox"> 自动放行安全工具（如读文件）
            </label>
          </div>

          <div class="settings-actions">
            <span id="settings-status" class="hint"></span>
            <button id="btn-settings-refresh">刷新模型列表</button>
            <button id="btn-settings-cancel" class="ghost">取消</button>
            <button id="btn-settings-save" class="primary">保存并应用</button>
          </div>
        </div>

        <div id="view-plugins" class="settings-view hidden">
          <div class="settings-section">
            <div class="section-title">已安装插件</div>
            <div class="plugin-tools">
              <input id="plugin-install-path" placeholder="插件目录绝对路径（含 plugin.json）" autocomplete="off">
              <button id="btn-plugin-install">安装</button>
              <button id="btn-plugin-refresh">刷新</button>
            </div>
            <div id="plugin-list" class="plugin-list"></div>
            <div id="plugin-status" class="form-hint"></div>
          </div>
        </div>

        <div id="view-plugin" class="settings-view hidden">
          <div id="plugin-detail" class="plugin-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>危险工具需要确认</h3>
      <p id="modal-tool"></p>
      <pre id="modal-preview" class="modal-pre"></pre>
      <p class="warn">这是协作式权限门，不是沙箱：确认后工具将以当前用户权限执行。</p>
      <div class="actions">
        <button id="btn-allow" class="danger">允许</button>
        <button id="btn-deny">拒绝</button>
      </div>
    </div>
  </div>
</body>
</html>
