<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeatherAgent</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">FeatherAgent <span class="ver">v1.1</span></div>
    <div class="meta">
      <span id="session-label">未选择会话</span>
      <span class="dot" id="state-dot"></span><span id="state-label">idle</span>
    </div>
    <div class="meta" id="conn">正在连接内核…</div>
  </header>

  <main>
    <aside class="sessions">
      <div class="panel-title">会话</div>
      <div class="new-row">
        <input id="new-id" placeholder="新会话 id（可空）">
        <button id="btn-new">新建</button>
      </div>
      <div id="session-list" class="list"></div>
    </aside>

    <section class="chat">
      <div class="panel-title">对话</div>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="actions">
          <button id="btn-send" class="primary">发送</button>
          <button id="btn-cancel">取消</button>
          <button id="btn-fork">Fork</button>
          <span id="hint" class="hint"></span>
        </div>
      </div>
    </section>

    <aside class="context">
      <div class="panel-title">上下文</div>
      <div id="ctx" class="ctx">尚无快照</div>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>危险工具需要确认</h3>
      <p id="modal-tool"></p>
      <p class="warn">这是协作式权限门，不是沙箱：确认后工具将以当前用户权限执行。</p>
      <div class="actions">
        <button id="btn-allow" class="danger">允许</button>
        <button id="btn-deny">拒绝</button>
      </div>
    </div>
  </div>
</body>
</html>
